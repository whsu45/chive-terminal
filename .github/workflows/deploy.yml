name: Update Taiwan Futures Forecast Page

on:
  schedule:
    # 第1次執行：台灣時間每週一至週六 06:12 AM (對應 UTC 22:30 Sun-Thu)
    - cron: '12 22 * * 0-5'
    # 第2次備援執行：台灣時間每週一至週六 07:13 AM (對應 UTC 00:30 Mon-Fri)
    - cron: '13 23 * * 1-6'
    # 第3次備援執行：台灣時間每週一至週六 08:12 AM (對應 UTC 01:30 Mon-Fri)
    - cron: '12 0 * * 1-6'
    # 第4次備援執行：台灣時間每週一至週六 10:12 AM (對應 UTC 01:30 Mon-Fri)
    - cron: '12 2 * * 1-6'
    # 第5次備援執行：台灣時間每週一至週六 12:12 AM (對應 UTC 01:30 Mon-Fri)
    - cron: '12 4 * * 1-6'
    # 第6次備援執行：台灣時間每週一至週六 15:11 PM (對應 UTC 07:00 Mon-Fri)
    - cron: '11 7 * * 1-6'
    # 第7次備援執行：台灣時間每週一至週六 20:11 PM (對應 UTC 12:00 Mon-Fri)
    - cron: '11 12 * * 1-6'
  
  workflow_dispatch:

permissions:
  contents: write  # 開放寫入權限以 commit history.json 回 Git repo
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 期交所夜盤三大法人約 06:00 後才公布。這次剛好在 04:30～06:45 跑時，先等到公布再抓
      # （GitHub 排程常延後、早上那幾次常被丟掉，錯過這次下一次可能 10 點後才來）；其他時段直接略過
      - name: Wait for TAIFEX after-hours institutional data
        continue-on-error: true
        timeout-minutes: 140
        run: |
          python scripts/wait_taifex_ah.py

      - name: Fetch Market Data and Build
        run: |
          python fetch_and_build.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 族群強弱勢個股：以策略引擎判讀當日漲跌前段候選股（失敗不影響其他頁面部署）
      - name: Build theme strong/weak picks
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          node scripts/build_theme_picks.mjs

      # 美股科技族群趨勢與台股連動（Yahoo Finance 日線；失敗不影響其他頁面部署）
      - name: Build US tech sector linkage
        continue-on-error: true
        run: |
          node scripts/build_us_tech.mjs

      # 期貨夜盤走勢：市值前 50 名裡有夜盤期貨的個股與每天夜盤漲跌（期交所、證交所公開資料；失敗不影響其他頁面部署）
      - name: Build night futures
        continue-on-error: true
        run: |
          python scripts/build_night_futures.py

      # 最新漲停個股：最新一個交易日的上市櫃漲停股＋分時走勢＋隔日沖分點（證交所、櫃買、Yahoo、MoneyDJ 公開資料；分點表傍晚才出，20:11 那次補上；抓不到就保留舊資料，失敗不影響其他頁面部署）
      - name: Build limit-up stocks
        continue-on-error: true
        run: |
          python scripts/build_limit_up.py

      # 將更新後的 data/history.json 與族群資料推回 Git 儲存庫備份。
      # 這個工作要跑 10 分鐘以上，期間別人（盤中資料同步、盤前選股、手動 push）可能先推了，直接 git push 會被拒絕
      # （2026-11-24 12:00 那次就是這樣失敗，連後面的 Pages 部署都沒跑）。工作目錄裡還有剛產生、沒要 commit 的 index.html，
      # 不能直接 git pull --rebase。所以改成：在另一個工作目錄放「遠端最新版」，把這次產生的資料檔複製過去再 commit / push，
      # 被拒絕就重抓遠端再來一次（最多 5 次）。資料檔以這次產生的為準（只有這個流程在寫）；目前的工作目錄不動，後面照樣部署。
      # 這一步只是備份，就算 5 次都失敗也繼續部署（continue-on-error）。
      - name: Commit and push updated history.json
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          FILES="data/history.json data/themes.json data/theme_picks.json data/us_tech.json data/us_tech_history.json data/night_futures.json data/limit_up.json"
          BR="${GITHUB_REF_NAME}"
          PUSH_DIR="${RUNNER_TEMP}/push"
          for i in 1 2 3 4 5; do
            cd "${GITHUB_WORKSPACE}"
            git fetch --quiet origin "${BR}"
            rm -rf "${PUSH_DIR}"
            git worktree prune
            git worktree add --quiet --detach "${PUSH_DIR}" "origin/${BR}"
            for f in ${FILES}; do
              if [ -f "$f" ]; then
                mkdir -p "${PUSH_DIR}/$(dirname "$f")"
                cp "$f" "${PUSH_DIR}/$f"
              fi
            done
            cd "${PUSH_DIR}"
            for f in ${FILES}; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if git diff --staged --quiet; then
              echo "資料沒有變，不 commit"
              exit 0
            fi
            git commit --quiet -m "auto: update history.json [skip ci]"
            if git push origin "HEAD:${BR}"; then
              echo "推上去了（第 ${i} 次）"
              exit 0
            fi
            echo "第 ${i} 次被拒絕（遠端有新的 commit），重抓再試"
            sleep $((i * 10))
          done
          echo "push 失敗（試了 5 次），這次資料只部署、沒備份進 repo"
          exit 1

      # 每個頁面的 ./assets/*.js 加上 ?v=<commit>：GitHub Pages 讓瀏覽器快取 10 分鐘，
      # 不加的話剛部署完會出現「新 HTML + 舊 JS」（例如新加的篩選勾選框沒有作用）。只改要部署的檔案，不 commit 回 repo
      - name: Cache-bust page scripts
        run: |
          v="${GITHUB_SHA::7}"
          for f in *.html; do
            sed -i -E "s#(src=\"\./assets/[^\"?]+\.js)\"#\1?v=${v}\"#g" "$f"
          done
          grep -ho 'assets/[^"]*\.js?v=[0-9a-f]*' *.html | sort -u

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
