name: Update Taiwan Futures Forecast Page

on:
  schedule:
    # 第一次執行：台灣時間每週一至週五 07:30 AM (對應 UTC 23:30 Sun-Thu)
    - cron: '30 23 * * 0-4'
    # 第二次備援執行：台灣時間每週一至週五 08:30 AM (對應 UTC 00:30 Mon-Fri)
    - cron: '30 0 * * 1-5'
  
  # 支援在 GitHub 介面上手動點擊執行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Build HTML
        run: |
          python fetch_and_build.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

