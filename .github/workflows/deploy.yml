name: Update Taiwan Futures Forecast Page

on:
  # 推 code 到 main 就立即重抓資料並部署（bot 的資料 commit 用 GITHUB_TOKEN 推送，不會再觸發，不會無限循環）
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'

  # GitHub 排程在本 repo 實測延遲 2～5.5 小時（凌晨 UTC 22–23 時段約 2 小時，白天約 4–5 小時），
  # 所以盤前時段刻意提早、多排幾次；每次執行只補抓尚未定案的日期，重複執行無副作用。
  # 分鐘數避開 :00 / :30 尖峰。時間皆為台灣時間 (UTC+8)。
  schedule:
    # 盤前：夜盤 05:00 收盤、美股 04:00（夏令）／05:00（冬令）收盤後的資料，需在 08:45 期貨開盤前上線
    # 週一至週六（週六早上是週五夜盤；週一早上是週五夜盤歸檔到週一的紀錄）
    - cron: '47 20 * * 0-5'   # 台灣 04:47 週一至週六
    - cron: '37 21 * * 0-5'   # 台灣 05:37 週一至週六
    - cron: '23 22 * * 0-5'   # 台灣 06:23 週一至週六
    - cron: '17 23 * * 0-5'   # 台灣 07:17 週一至週六
    # 盤後：日盤 13:45 收盤後的三大法人、證交所／櫃買收盤行情、券商分點（週一至週五）
    - cron: '7 6 * * 1-5'     # 台灣 14:07 週一至週五
    # 晚間：FinMind 融資融券等晚間才完整的資料，供族群強弱勢判讀（週一至週五）
    - cron: '41 11 * * 1-5'   # 台灣 19:41 週一至週五

  workflow_dispatch:

permissions:
  contents: write  # 開放寫入權限以 commit history.json 回 Git repo
  pages: write
  id-token: write

# 排隊而不取消：避免部署做到一半被下一個觸發中斷；同時只保留最新一個等待中的執行
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 取分支「當下」最新內容（含前一次執行推回的資料 commit），而非觸發當時的 commit
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Build
        run: |
          python fetch_and_build.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 族群強弱勢個股：以策略引擎判讀當日漲跌前段候選股（失敗不影響其他頁面部署）
      - name: Build theme strong/weak picks
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          node scripts/build_theme_picks.mjs

      # 個股短沖（ORB）：Yahoo 5 分 K 回測，產物隨網站發布、不 commit 回 Git（失敗不影響其他頁面部署）
      - name: Build ORB day-trade data
        continue-on-error: true
        run: |
          node scripts/build_orb.mjs

      # 將更新後的 data/history.json 與族群資料推回 Git 儲存庫備份
      - name: Commit and push updated history.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json data/themes.json data/theme_picks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update history.json [skip ci]" && git pull --rebase origin "${{ github.ref_name }}" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
