name: Update Taiwan Futures Forecast Page

on:
  schedule:
    # 第1次執行：台灣時間每週一至週六 06:12 AM (對應 UTC 22:30 Sun-Thu)
    - cron: '12 22 * * 0-5'
    # 第2次備援執行：台灣時間每週一至週六 07:13 AM (對應 UTC 00:30 Mon-Fri)
    - cron: '13 23 * * 1-6'
    # 第3次備援執行：台灣時間每週一至週六 08:12 AM (對應 UTC 01:30 Mon-Fri)
    - cron: '12 0 * * 1-6'
    # 第4次備援執行：台灣時間每週一至週六 15:11 PM (對應 UTC 07:00 Mon-Fri)
    - cron: '11 7 * * 1-6'
    # 第5次備援執行：台灣時間每週一至週六 20:11 PM (對應 UTC 12:00 Mon-Fri)
    - cron: '11 12 * * 1-6'
  
  workflow_dispatch:

permissions:
  contents: write  # 開放寫入權限以 commit history.json 回 Git repo
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Build
        run: |
          python fetch_and_build.py

      # 將更新後的 data/history.json 推回 Git 儲存庫備份
      - name: Commit and push updated history.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update history.json [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
