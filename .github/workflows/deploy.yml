name: Update Taiwan Futures Forecast Page

on:
  schedule:
    # 第一次執行：台灣時間每週一至週五 07:30 AM (對應 UTC 23:30 Sun-Thu)
    - cron: '30 23 * * 0-4'
    # 第二次備援執行：台灣時間每週一至週五 08:30 AM (對應 UTC 00:30 Mon-Fri)
    - cron: '30 0 * * 1-5'
    # 第三次備援執行：台灣時間每週一至週五 09:30 AM (對應 UTC 01:30 Mon-Fri)
    - cron: '30 1 * * 1-5'
    # 第四次備援執行：台灣時間每週一至週五 11:30 AM (對應 UTC 03:30 Mon-Fri)
    - cron: '30 3 * * 1-5'
    # 第五次備援執行：台灣時間每週一至週五 15:00 PM (對應 UTC 07:00 Mon-Fri)
    - cron: '0 7 * * 1-5'
    # 第六次備援執行：台灣時間每週一至週五 20:00 PM (對應 UTC 12:00 Mon-Fri)
    - cron: '0 12 * * 1-5'
  
  workflow_dispatch:

permissions:
  contents: write  # 開放寫入權限以 commit history.json 回 Git repo
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Build
        run: |
          python fetch_and_build.py

      # 將更新後的 data/history.json 推回 Git 儲存庫備份
      - name: Commit and push updated history.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update history.json [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
