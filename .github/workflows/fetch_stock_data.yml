# .github/workflows/fetch_stock_data.yml
name: Fetch Latest Stock Data

on:
  schedule:
    # Triggers every 30 minutes from 08:00 to 15:30 Taipei Time (00:00 to 07:30 UTC), Monday to Friday
    - cron: '*/30 0-7 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Grants write access so the action can commit data back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch stock data
        run: python fetch_stocks.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update real-time stock cache: $(date)" && git push)