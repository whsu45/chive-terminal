name: Sync Yahoo Finance Core Data

on:
  schedule:
    # Runs every 30 minutes between 01:00 UTC and 22:00 UTC, Monday to Friday
    - cron: '*/30 1-22 * * 1-5'
  workflow_dispatch: # Allows manual trigger directly via GitHub UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants write permission to push data.json back to your repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run Scraper
        run: python fetch_data.py

      - name: Commit and Push Update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "chore: auto-sync stock data from Yahoo Finance" || exit 0
          git push