<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>當沖監控</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--fg:#e6e9ef;--muted:#8b93a3;--up:#ff4d4f;--dn:#2ecc71;--warn:#ffb020;--accent:#4c8dff;--vwap:#f5c542;--mono:"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--muted)}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .tabs{display:flex;gap:6px}
header .tab{padding:6px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel2)}
header .tab.active{border-color:var(--accent);background:#1b2a46}
header .meta{margin-left:auto;display:flex;gap:18px;color:var(--muted);align-items:center;flex-wrap:wrap}
.clock{font-size:20px;color:var(--fg)}
.phase{padding:4px 10px;border-radius:6px;background:var(--panel2);color:var(--fg);font-weight:600;cursor:help;border:1px solid var(--line)}
.phase.early{border-color:var(--accent);background:#1b2a46}.phase.mid{border-color:#5a5f6b}.phase.late{border-color:var(--warn);background:#2b2210;color:var(--warn)}
.phase.closed,.phase.pre,.phase.trial{color:var(--muted)}
main{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:12px;padding:12px 16px;max-width:1800px;margin:0 auto}
@media (max-width:1200px){main{grid-template-columns:1fr 1fr}}
@media (max-width:760px){main{grid-template-columns:1fr;padding:8px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.charts{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px}
@media (max-width:1200px){.charts{grid-template-columns:1fr 1fr}.charts .stock{grid-column:span 2}}
@media (max-width:760px){.charts{grid-template-columns:1fr}.charts .stock{grid-column:span 1}}
.charts .card{padding:8px 10px}
.charts canvas{width:100%;height:230px;display:block}
.charts .stock canvas{height:300px}
.price{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.price .big{font-size:44px;font-weight:700;line-height:1}
.price .chg{font-size:22px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px 12px;margin-top:10px}
.kv div{color:var(--muted);font-size:12px}.kv b{display:block;color:var(--fg);font-weight:500;font-size:15px}
.verdict{font-size:18px;font-weight:600;margin:6px 0 10px}
.bars{display:grid;grid-template-columns:40px 1fr 56px;gap:8px;align-items:center;margin:4px 0}
.bar{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
.bar.long i{background:linear-gradient(90deg,#a12,#ff4d4f)}.bar.short i{background:linear-gradient(90deg,#176,#2ecc71)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{padding:8px 10px;border-radius:8px;background:#2b2210;border-left:4px solid var(--warn);font-size:13px}
.alert.hard{background:#3a1616;border-left-color:var(--up)}
.alert.note{background:var(--panel2);border-left-color:var(--line);color:var(--muted)}
.alert .t{font-family:var(--mono);color:var(--muted);margin-right:6px;font-size:12px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.alert.new{animation:blink .9s step-end infinite;box-shadow:0 0 0 1px var(--warn) inset}
.alert.new.hard{box-shadow:0 0 0 1px var(--up) inset}
.plan .box .note{font-size:12px;color:var(--warn);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 8px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);cursor:help;white-space:nowrap}
.chip.pos{border-color:#5a2426;background:#2a1517}.chip.neg{border-color:#1f5a3a;background:#122a1d}.chip.zero{opacity:.7}
.chip b{font-family:var(--mono);margin-left:4px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan .box{background:var(--panel2);border-radius:10px;padding:10px;border-top:3px solid var(--line)}
.plan .box.short{border-top-color:var(--dn)}.plan .box.long{border-top-color:var(--up)}
.plan .box.dim{opacity:.55}
.plan .box h4{margin:0 0 6px;font-size:13px}
.plan .box .entry{font-size:13px;color:var(--fg);margin-bottom:6px}
.plan table{width:100%;font-size:13px;border-collapse:collapse}.plan td{padding:2px 0}.plan td:last-child{text-align:right}
.fs{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.fs canvas{width:100%;height:88px;display:block;margin:2px 0 8px}
.fs .small{font-size:12px;color:var(--muted)}.fs .small b{font-family:var(--mono);font-weight:600}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.ctl .tag{padding:2px 8px;border-radius:6px;font-weight:700;color:#0f1115;background:#f5a623}.ctl .tag.retail{background:#8b93a3}
.ctl .track{flex:1;height:8px;border-radius:4px;background:#3a4150;overflow:hidden;display:flex}.ctl .track i{display:block;height:100%;background:#f5a623}
.ctl b{font-family:var(--mono)}
.wall{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);font-size:12px;border-left:4px solid var(--line)}
.wall.bid{border-left-color:var(--up)}.wall.ask{border-left-color:var(--dn)}.wall.ended{opacity:.6}
.wall b{font-family:var(--mono)}.wall .v{font-weight:700}.wall .v.real{color:var(--up)}.wall .v.fake{color:var(--warn)}
.hist .kv b{font-size:14px}.hist table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px}.hist td{padding:2px 4px}.hist td.n{text-align:right;font-family:var(--mono)}
.hist .wl{font-weight:700}.hist .note{font-size:12px;color:var(--muted);margin-top:4px}
.tab .days{font-size:11px;color:var(--muted);margin-left:4px}
.ladder{font-family:var(--mono);font-size:13px}
.ladder .row{display:flex;justify-content:space-between;padding:3px 8px;border-radius:6px}
.ladder .row.r{color:var(--dn)}.ladder .row.s{color:var(--up)}
.ladder .row.now{background:#1b2a46;color:var(--fg);font-weight:700;margin:4px 0}
.book{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:var(--mono);font-size:13px}
.book .lv{display:grid;grid-template-columns:60px 1fr 50px;gap:6px;align-items:center;padding:2px 0}
.book .lv i{display:block;height:12px;border-radius:3px;opacity:.75}
.book .bid i{background:var(--up)}.book .ask i{background:var(--dn)}
.flow .row{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.flow .track{height:14px;background:var(--panel2);border-radius:4px;position:relative}
.flow .track i{position:absolute;top:0;height:100%;border-radius:4px}
.flow .track i.p{left:50%;background:var(--up)}.flow .track i.n{right:50%;background:var(--dn)}
.flow .track:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{color:var(--muted);text-align:left;font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
table.grid td{padding:3px 6px;border-bottom:1px solid #20242d}
table.grid td.n{text-align:right;font-family:var(--mono)}
#chart{width:100%;height:220px;display:block}
.span2{grid-column:span 2}@media (max-width:760px){.span2{grid-column:span 1}}
.muted{color:var(--muted)}.small{font-size:12px}
footer{padding:8px 16px;color:var(--muted);font-size:12px;text-align:center}
.stale{color:var(--warn)}
.signal{margin:0 0 10px;padding:10px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;animation:pulse 1.4s ease-in-out infinite;border:1px solid}
.signal.hidden{display:none}
.signal.short{background:#0d3a24;border-color:#2ecc71;color:#2ecc71}.signal.long{background:#471215;border-color:#ff4d4f;color:#ff4d4f}
.signal.ended{animation:none;opacity:.75;border-style:dashed}
.signal .h{font-size:16px;font-weight:700}.signal .px{font-size:22px;font-weight:800;font-family:var(--mono)}
.signal .d{font-size:12px;color:var(--fg)}.signal .d b{font-family:var(--mono)}.signal .why{font-size:12px;color:var(--muted);flex-basis:100%}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 12px 1px currentColor}}
.hint{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <div class="meta">
    <span id="idx"></span>
    <span id="shioaji"></span>
    <span class="phase" id="phase"></span>
    <span class="clock num" id="clock"></span>
  </div>
</header>
<main id="main">
  <section class="charts">
    <div class="card"><h3 id="t-tse">加權</h3><canvas id="jb-tse"></canvas></div>
    <div class="card"><h3 id="t-otc">櫃買</h3><canvas id="jb-otc"></canvas></div>
    <div class="card stock"><h3 id="t-stk">個股</h3><canvas id="jb-stk"></canvas></div>
  </section>
  <section class="card" id="c-price"><h3>即時 <span class="small muted" id="live-t"></span></h3><div id="price"></div></section>
  <section class="card" id="c-verdict"><h3>多空勝率 <span class="small muted" id="eval-t"></span></h3><div id="signal" class="signal hidden"></div><div id="verdict"></div></section>
  <section class="card" id="c-alerts"><h3>警示</h3><div class="alerts" id="alerts"></div></section>
  <section class="card" id="c-flow"><h3>主力 / 散戶 分流</h3><div class="flow" id="flow"></div>
    <div class="fs" id="fs"><div class="ctl" id="ctl"></div><div class="small" id="fs-big-t"></div><canvas id="fs-big"></canvas><div class="small" id="fs-small-t"></div><canvas id="fs-small"></canvas></div></section>
  <section class="card" id="c-plan"><h3>進出場計畫（已畫在個股江波圖）</h3><div class="plan" id="plan"></div></section>
  <section class="card" id="c-ladder"><h3>壓力 / 支撐</h3><div class="ladder" id="ladder"></div></section>
  <section class="card" id="c-factors"><h3>因子（滑鼠停留看理由）</h3><div id="factors"></div></section>
  <section class="card" id="c-book"><h3>五檔</h3><div class="book" id="book"></div><div id="walls"></div></section>
  <section class="card" id="c-group"><h3>族群</h3><div id="group"></div></section>
  <section class="card" id="c-hist"><h3>交戰紀錄 <span class="small muted">（做熟悉的股票）</span></h3><div id="hist"></div></section>
  <section class="card" id="c-warr"><h3>權證</h3><div id="warr"></div></section>
  <section class="card span2" id="c-chart"><h3>勝率曲線（每次估算）</h3><canvas id="chart" height="220"></canvas></section>
  <section class="card" id="c-pre"><h3>盤前摘要</h3><pre id="pre" class="small" style="white-space:pre-wrap;margin:0;color:var(--muted)"></pre></section>
</main>
<footer id="foot">以上為技術面與籌碼面推算，不構成投資建議。</footer>
<script>
let STATE=null, LIVE=null, CUR=null, HIST={};
const $=id=>document.getElementById(id);
const f=(x,d=2)=>x==null?'-':Number(x).toFixed(d);
const pct=(x,d=2)=>x==null?'-':(x>0?'+':'')+Number(x).toFixed(d)+'%';
const cls=x=>x>0?'up':x<0?'dn':'flat';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=p=>p==null?2:p>=500?0:p>=100?1:p>=50?1:2;
const sgn=(x,d=2)=>x==null?'-':(x>0?'+':'')+Number(x).toFixed(d);
const chgTxt=(ref,y,d)=>(ref==null||!y)?'-':`${sgn(ref-y,d)} (${pct((ref/y-1)*100)})`;
const fp=p=>f(p,dec(p));

// 時段（與 model.PHASES 一致；後端沒回時前端自己算）
const PHASES=[['pre','00:00','08:30','盤前','','看夜盤、美股與盤前籌碼，定今天的主劇本'],['trial','08:30','09:00','試撮','08:30–09:00','掛單可撤，價量可能是假的；只看方向不下結論'],
 ['early','09:00','10:30','早盤','09:00–10:30','隔日沖倒貨與主力表態多在此段；首 10 分鐘不追單，等 VWAP 與分流方向一致再進'],
 ['mid','10:30','12:00','中盤','10:30–12:00','量能通常縮、假突破多，只做 5 分 K 確認的突破/跌破單，目標縮短'],
 ['late','12:00','13:30','尾盤','12:00–13:30','法人作價與當沖回補主導，順 VWAP 方向做；13:20 前當沖部位處理完，13:25 後試撮不開新單'],
 ['closed','13:30','24:00','已收盤','','復盤：review.py / replay.py']];
function phaseNow(){const n=new Date();const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const p=PHASES.find(([k,a,b])=>a<=hm&&hm<b)||PHASES[PHASES.length-1];return {key:p[0],label:p[3],range:p[4],hint:p[5]};}
function tick(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('zh-TW',{hour12:false});
  const ph=(LIVE&&LIVE.phase)||phaseNow();const el=$('phase');el.className='phase '+ph.key;el.textContent=ph.label+(ph.range?' '+ph.range:'');el.title=ph.hint||'';}
setInterval(tick,1000);tick();

async function loadState(){try{const r=await fetch('/api/state?_='+Date.now());STATE=await r.json();
  if(!CUR||!STATE.codes.includes(CUR))CUR=STATE.codes[0];render();
  const h=await fetch('/api/history/'+CUR+'?_='+Date.now());HIST[CUR]=await h.json();drawChart();}
  catch(e){$('foot').innerHTML='<span class="stale">連線中斷（monitor 還在跑嗎？）：'+esc(e)+'</span>';}}
async function loadLive(){try{const r=await fetch('/api/live?_='+Date.now());const j=await r.json();LIVE=(j&&j.quotes)?j:null;if(STATE)renderLive();}catch(e){}}
setInterval(loadState,10000);setInterval(loadLive,3000);loadState();setTimeout(loadLive,1000);

function activeSide(ev){if(!ev)return null;if(ev.p_short<=0)return 'long';return ev.p_short>=ev.p_long?'short':'long';}

// ---------------------------------------------------------------- 江波圖
function drawJB(c,o){
  const dpr=window.devicePixelRatio||1;const W=c.width=c.clientWidth*dpr,H=c.height=c.clientHeight*dpr;const g=c.getContext('2d');g.clearRect(0,0,W,H);
  const F=px=>px*dpr;g.font=`${F(11)}px ${getComputedStyle(document.body).fontFamily}`;
  const ref=o.y;const pts=(o.series||[]).map(b=>o.stock?{t:b[0],o:b[1],h:b[2],l:b[3],c:b[4],v:b[5],a:b[6]}:{t:b[0],c:b[1],v:0,a:0}).filter(p=>p.c!=null);
  if(!ref||!pts.length){g.fillStyle='#8b93a3';g.fillText(ref?'等待分時資料…':'等待報價…',F(10),F(20));return;}
  const padL=F(6),padR=F(o.stock?96:84),padT=F(8),padB=F(16),volH=o.stock?Math.round(H*0.17):0;
  const x0=padL,x1=W-padR,y0=padT,y1=H-padB-volH-(o.stock?F(4):0);
  const mins=t=>{const [h,m]=t.split(':').map(Number);return Math.min(270,Math.max(0,(h-9)*60+m));};
  const X=m=>x0+(x1-x0)*m/270;
  // 範圍：上下各自依實際走勢（非對稱），昨收永遠在圖內；大跌日不會把線擠在下半部
  let up=0,dn=0;pts.forEach(p=>{up=Math.max(up,p.c-ref);dn=Math.max(dn,ref-p.c);if(o.stock){up=Math.max(up,p.h-ref);dn=Math.max(dn,ref-p.l);}});
  const lv=[];if(o.plan){for(const side of ['short','long']){const pl=o.plan[side];if(!pl)continue;[pl.trigger_px,pl.entry_px,pl.stop,pl.t1,pl.t2].forEach(v=>{if(v!=null&&Math.abs(v-ref)/ref<0.1)lv.push(v);});}}
  lv.forEach(v=>{up=Math.max(up,v-ref);dn=Math.max(dn,ref-v);});
  const minDev=ref*0.004;up=Math.max(up,minDev)*1.12;dn=Math.max(dn,minDev)*1.12;
  const Y=v=>y0+(y1-y0)*(up-(v-ref))/(up+dn);
  // 格線：以整齊的百分比為間距（每邊最多 4 條），右側標 % 與價位
  const maxPct=Math.max(up,dn)/ref*100;const steps=[0.25,0.5,1,2,2.5,5,10];const stepP=steps.find(st=>maxPct/st<=4)||10;
  const lastY=Y(o.last??pts[pts.length-1].c);
  g.lineWidth=F(1);g.strokeStyle='#232833';
  for(let k=1;k<=8;k++){for(const sg of [1,-1]){const v=ref*(1+sg*k*stepP/100);if(v>ref+up||v<ref-dn)continue;g.beginPath();g.moveTo(x0,Y(v));g.lineTo(x1,Y(v));g.stroke();
    if(Math.abs(Y(v)-lastY)<F(13)||Math.abs(Y(v)-Y(ref))<F(13))continue;   // 跟最新價 / 昨收標籤重疊就不印
    g.fillStyle=sg>0?'#ff4d4f':'#2ecc71';g.globalAlpha=.85;g.fillText(`${sg>0?'+':'-'}${k*stepP}% ${o.stock?fp(v):f(v,0)}`,x1+F(4),Y(v)+F(4));g.globalAlpha=1;}}
  g.setLineDash([F(4),F(4)]);g.strokeStyle='#8b93a3';g.beginPath();g.moveTo(x0,Y(ref));g.lineTo(x1,Y(ref));g.stroke();g.setLineDash([]);
  g.fillStyle='#8b93a3';g.fillText('昨收 '+(o.stock?fp(ref):f(ref,0)),x1+F(4),Y(ref)+F(4));
  // 時段分隔與時間軸
  const ticks=[['09:00',0],['10:00',60],['10:30',90],['11:00',120],['12:00',180],['13:00',240],['13:30',270]];
  ticks.forEach(([lab,m])=>{const strong=(m===90||m===180);g.strokeStyle=strong?'#3a4150':'#232833';g.setLineDash(strong?[F(2),F(3)]:[]);g.beginPath();g.moveTo(X(m),y0);g.lineTo(X(m),H-padB);g.stroke();g.setLineDash([]);
    if(m%60===0||m===270){g.fillStyle='#8b93a3';g.fillText(lab,X(m)-F(m===270?30:14),H-F(4));}});
  // 現在時間
  const n=new Date();const nm=(n.getHours()-9)*60+n.getMinutes();if(nm>0&&nm<270){g.strokeStyle='#4c8dff';g.globalAlpha=.5;g.beginPath();g.moveTo(X(nm),y0);g.lineTo(X(nm),y1);g.stroke();g.globalAlpha=1;}
  // 成交量
  if(o.stock&&volH){const mv=Math.max(1,...pts.map(p=>p.v||0));const bw=Math.max(F(1),(x1-x0)/270*0.8);pts.forEach(p=>{const hgt=(p.v||0)/mv*volH;g.fillStyle=p.c>=p.o?'rgba(255,77,79,.55)':'rgba(46,204,113,.55)';g.fillRect(X(mins(p.t))-bw/2,H-padB-hgt,bw,hgt);});}
  // 價格線（分段上色 + 與昨收間淡填色）
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const col=b.c>=ref?'#ff4d4f':'#2ecc71';const xa=X(mins(a.t)),xb=X(mins(b.t));
    g.fillStyle=col;g.globalAlpha=.10;g.beginPath();g.moveTo(xa,Y(ref));g.lineTo(xa,Y(a.c));g.lineTo(xb,Y(b.c));g.lineTo(xb,Y(ref));g.closePath();g.fill();g.globalAlpha=1;
    g.strokeStyle=col;g.lineWidth=F(1.6);g.beginPath();g.moveTo(xa,Y(a.c));g.lineTo(xb,Y(b.c));g.stroke();}
  if(pts.length===1){const p=pts[0];g.fillStyle=p.c>=ref?'#ff4d4f':'#2ecc71';g.beginPath();g.arc(X(mins(p.t)),Y(p.c),F(2.5),0,7);g.fill();}
  // VWAP

      const line=(v,lab,color,dash,w)=>{if(v==null||Math.abs(v-ref)/ref>=0.1)return;g.setLineDash(dash);g.strokeStyle=color;g.lineWidth=F(w);g.beginPath();g.moveTo(x0,Y(v));g.lineTo(x1,Y(v));g.stroke();g.setLineDash([]);
        const txt=lab+' '+fp(v);const tw=g.measureText(txt).width+F(6);g.fillStyle='#0f1115';g.fillRect(x1-tw-F(2),Y(v)-F(7),tw,F(13));g.fillStyle=color;g.fillText(txt,x1-tw+F(1),Y(v)+F(4));};
      line(pl.trigger_px,side==='short'?'壓':'撐','#9aa4b2',[F(6),F(4)],1.1);line(pl.entry_px,side==='short'?'空進':'多進',col,[],on?1.8:1);line(pl.stop,'損','#ffb020',[F(5),F(3)],1.2);line(pl.t1,'T1',col,[F(2),F(3)],1);line(pl.t2,'T2',col,[F(2),F(3)],1);g.globalAlpha=1;};

}

function drawFlowSeries(fl){const fs=(LIVE&&LIVE.flow_series&&LIVE.flow_series[CUR])||[];const box=$('fs');if(!fl||!fs.length){box.style.display='none';return;}box.style.display='';
  const bigV=(fl.big_buy||0)+(fl.big_sell||0),smV=(fl.small_buy||0)+(fl.small_sell||0),tot=bigV+smV||1;const bigCtl=bigV>=smV;
  $('ctl').innerHTML=`<span class="tag ${bigCtl?'':'retail'}">${bigCtl?'大戶控盤':'散戶控盤'}</span><span>大 <b>${bigV}</b></span><div class="track"><i style="width:${bigV/tot*100}%"></i></div><span><b>${smV}</b> 散</span>`;
  const last=fs[fs.length-1],prev=fs.length>1?fs[fs.length-2]:last;
  const lab=(nm,cum,d)=>`${nm}累積<span class="${cum>=0?'up':'dn'}">${cum>=0?'買超':'賣超'} <b>${Math.abs(cum)}</b></span> 張 · 本分鐘 ${nm}<span class="${d>=0?'up':'dn'}">${d>=0?'買進':'賣出'} <b>${Math.abs(d)}</b></span> 張`;
  $('fs-big-t').innerHTML=lab('大戶',last[1],last[1]-prev[1]);$('fs-small-t').innerHTML=lab('散戶',last[2],last[2]-prev[2]);
  const draw=(cv,idx)=>{const dpr=window.devicePixelRatio||1;const W=cv.width=cv.clientWidth*dpr,H=cv.height=cv.clientHeight*dpr;const g=cv.getContext('2d');g.clearRect(0,0,W,H);const F=px=>px*dpr;g.font=`${F(10)}px ${getComputedStyle(document.body).fontFamily}`;
    const padL=F(4),padR=F(40),padT=F(4),padB=F(4);const x0=padL,x1=W-padR,y0=padT,y1=H-padB;
    const mins=t=>{const [h,m]=t.split(':').map(Number);return Math.min(270,Math.max(0,(h-9)*60+m));};const X=m=>x0+(x1-x0)*m/270;
    const vals=fs.map(r=>r[idx]);let hi=Math.max(0,...vals),lo=Math.min(0,...vals);if(hi===lo){hi=1;lo=-1;}const pad=(hi-lo)*0.08;hi+=pad;lo-=pad;
    const Y=v=>y0+(y1-y0)*(1-(v-lo)/(hi-lo));const Y0=Y(0);

    g.fillStyle='#8b93a3';g.fillText(String(Math.round(hi-pad)),x1+F(4),y0+F(9));g.fillText(String(Math.round(lo+pad)),x1+F(4),y1-F(1));g.fillText('0',x1+F(4),Y0+F(3));};
  draw($('fs-big'),1);draw($('fs-small'),2);}

// 警示：全部帶時間戳（即時警示用產生時間、估算警示用估算時間），60 秒內的新警示閃爍
function ageSec(t){if(!t)return 1e9;const [hh,mm,ss]=t.split(':').map(Number);const n=new Date();return (n.getHours()*3600+n.getMinutes()*60+n.getSeconds())-(hh*3600+mm*60+(ss||0));}
function renderAlerts(ev){const live=(LIVE&&LIVE.alerts&&LIVE.alerts[CUR])||ev.live_alerts||[];const seen=new Set();const out=[];
  live.slice().reverse().forEach(([t,w])=>{if(seen.has(w.slice(0,24)))return;seen.add(w.slice(0,24));const a=ageSec(t);out.push(`<div class="alert hard ${a<60?'new':''}"><span class="t">${esc(t)}</span>${esc(w)}</div>`);});
  (ev.warnings||[]).forEach(w=>{if(seen.has(w.slice(0,24)))return;seen.add(w.slice(0,24));const hard=/處置|⚠/.test(w);const note=/首 10 分鐘|尾盤|已收盤|試撮/.test(w)&&!hard;const a=ageSec(ev.time);
    out.push(`<div class="alert ${hard?'hard':note?'note':''} ${hard&&a<60?'new':''}"><span class="t">${esc(ev.time||'')}</span>${esc(w)}</div>`);});
  $('alerts').innerHTML=out.join('')||'<span class="muted">無</span>';}

  $('tabs').innerHTML=STATE.codes.map(c=>{const lq=LIVE&&LIVE.quotes[c];const e=STATE.latest[c];const ch=lq?lq.chg_pct:e?.info?.chg_pct;

  if(!LIVE){const idx=STATE.index||{};$('idx').innerHTML=Object.entries(idx).map(([k,v])=>`${k==='t00'?'加權':'櫃買'} <b class="num ${cls(v.chg)}">${f(v.ref,0)} ${v.y?chgTxt(v.ref,v.y,0):pct(v.chg)}</b>`).join(' &nbsp; ');
    $('shioaji').innerHTML=STATE.shioaji?'<span class="up">● 永豐串流</span>':'<span class="muted">○ 公開報價</span>';}

  const i=ev.info||{};
  const age=(Date.now()-new Date(STATE.updated).getTime())/1000;const next=Math.max(0,Math.round(STATE.interval-age));
  $('eval-t').innerHTML=`估算 ${esc(ev.time)} · 下次 ${String(Math.floor(next/60)).padStart(2,'0')}:${String(next%60).padStart(2,'0')}${age>STATE.interval*2?' <span class="stale">(過舊)</span>':''}`;
  const side=ev.side;const vcol=side==='空'?'dn':side==='多'?'up':'flat';const ph=(LIVE&&LIVE.phase)||i.phase||phaseNow();
  $('verdict').innerHTML=`<div class="verdict ${vcol}">${esc(ev.verdict)}</div>
   <div class="bars"><span class="up">多</span><div class="bar long"><i style="width:${ev.p_long}%"></i></div><b class="num up">${f(ev.p_long,0)}%</b></div>
   <div class="bars"><span class="dn">空</span><div class="bar short"><i style="width:${ev.p_short}%"></i></div><b class="num dn">${f(ev.p_short,0)}%</b></div>
   <div class="small muted" style="margin-top:6px">盤前 <b class="num">${f(ev.daily_bias,2)}</b> · 盤中 <b class="num">${f(ev.intra_bias,2)}</b> · 合計 <b class="num">${f(ev.bias,2)}</b></div>
   <div class="hint"><b>${esc(ph.label)}</b>${ph.range?' '+ph.range:''}：${esc(ph.hint)}</div>`;
  const chip=([n,s,t])=>`<span class="chip ${s>0?'pos':s<0?'neg':'zero'}" title="${esc(t)}">${esc(n)}<b>${s>0?'+':''}${f(s,1)}</b></span>`;
  $('factors').innerHTML=`<div class="small muted" style="margin-bottom:4px">盤前</div><div class="chips">${(ev.daily_factors||[]).map(chip).join('')||'<span class="muted">無</span>'}</div>
   <div class="small muted" style="margin:8px 0 4px">盤中</div><div class="chips">${(ev.intraday_factors||[]).map(chip).join('')||'<span class="muted">無</span>'}</div>`;
  const pl=ev.plan||{};const act=activeSide(ev);
  const box=(k,o,title)=>o?`<div class="box ${k} ${k===act?'':'dim'}"><h4>${title}${k===act?' <span class="small muted">主計畫</span>':''}</h4>${o.note?`<div class="note">⚠ ${esc(o.note)}</div>`:''}<div class="entry">${esc(o.entry)}</div><table>
    <tr><td>停損</td><td class="num">${fp(o.stop)} <span class="muted">(${f(o.risk_pct,1)}%)</span></td></tr><tr><td>目標 1</td><td class="num">${fp(o.t1)} <span class="muted">(${f(o.reward_pct,1)}%)</span></td></tr><tr><td>目標 2</td><td class="num">${fp(o.t2)}</td></tr></table>
    ${o.breakdown||o.breakout?`<div class="small muted" style="margin-top:6px">${esc(o.breakdown||o.breakout)}</div>`:''}</div>`:'';
  $('plan').innerHTML=box('short',ev.p_short>0?pl.short:null,`空 <span class="num dn">${f(ev.p_short,0)}%</span>`)+box('long',pl.long,`多 <span class="num up">${f(ev.p_long,0)}%</span>`);
  const res=(pl.resistance||[]).slice().reverse(),sup=pl.support||[];const cur=(LIVE&&LIVE.quotes[CUR]&&LIVE.quotes[CUR].ref)||ev.quote.ref;
  $('ladder').innerHTML=res.map(([n,v])=>`<div class="row r"><span>${esc(n)}</span><span>${fp(v)}</span></div>`).join('')+`<div class="row now"><span>現價</span><span>${fp(cur)}</span></div>`+sup.map(([n,v])=>`<div class="row s"><span>${esc(n)}</span><span>${fp(v)}</span></div>`).join('');
  const gd=i.group_detail||[];
  $('group').innerHTML=`<div class="small muted">族群均 <b class="num ${cls(i.group_avg)}">${pct(i.group_avg)}</b>（${i.group_up??'-'}/${i.group_n??'-'} 漲）· ${esc(d.group||'未定義')}</div>
    ${i.group_leader?`<div class="alert hard" style="margin:6px 0">族群領漲 <b>${esc(i.group_leader[2]||i.group_leader[1])}</b> <b class="num up">${pct(i.group_leader[0])}</b>：族群資金輪動，空單防接貨軋空</div>`:''}
    <table class="grid"><tr><th>代碼</th><th>名稱</th><th style="text-align:right">漲跌</th></tr>${gd.map(([p,c,n])=>`<tr><td class="num">${c}</td><td>${esc(n||'')}</td><td class="n ${cls(p)}">${pct(p)}</td></tr>`).join('')}</table>`;
  if(!LIVE){renderAlerts(ev);renderWarr(ev);
    const q=ev.quote;$('price').innerHTML=`<div class="price"><span class="big num ${cls(i.chg_pct)}">${fp(q.ref)}</span><span class="chg num ${cls(i.chg_pct)}">${chgTxt(q.ref,q.y,dec(q.ref))}</span><span class="muted">${esc(ev.time)}</span></div>`;}
  else renderLive();
}
function drawChart(){const h=HIST[CUR]||[];const c=$('chart');const dpr=window.devicePixelRatio||1;const W=c.width=c.clientWidth*dpr,H=c.height=220*dpr;const g=c.getContext('2d');g.clearRect(0,0,W,H);
  const F=px=>px*dpr;g.font=`${F(11)}px ${getComputedStyle(document.body).fontFamily}`;
  if(!h.length){g.fillStyle='#8b93a3';g.fillText('等待第一次估算…',F(10),F(20));return;}
  const padL=F(6),padR=F(70),padT=F(8),padB=F(16),gap=F(12);const x0=padL,x1=W-padR;
  const pH=Math.round((H-padT-padB-gap)*0.55);const y0a=padT,y1a=padT+pH,y0b=y1a+gap,y1b=H-padB;
  const mins=t=>{const [hh,mm]=t.split(':').map(Number);return Math.min(270,Math.max(0,(hh-9)*60+mm));};const X=m=>x0+(x1-x0)*m/270;
  const y=h[0].y;const ps=h.map(p=>p.price).filter(v=>v!=null);
  let lo=Math.min(...ps,y||Infinity),hi=Math.max(...ps,y||-Infinity);const padv=Math.max((hi-lo)*0.15,(y||ps[0])*0.003);lo-=padv;hi+=padv;
  const Ya=v=>y0a+(y1a-y0a)*(1-(v-lo)/(hi-lo));const Yb=v=>y0b+(y1b-y0b)*(1-v/100);
  // 時間軸（兩個面板共用）
  g.lineWidth=F(1);[['09:00',0],['10:00',60],['10:30',90],['11:00',120],['12:00',180],['13:00',240],['13:30',270]].forEach(([lab,m])=>{const strong=(m===90||m===180);
    g.strokeStyle=strong?'#3a4150':'#232833';g.setLineDash(strong?[F(2),F(3)]:[]);g.beginPath();g.moveTo(X(m),y0a);g.lineTo(X(m),y1b);g.stroke();g.setLineDash([]);
    if(m%60===0||m===270){g.fillStyle='#8b93a3';g.fillText(lab,X(m)-F(m===270?30:14),H-F(4));}});
  // 上面板：價格（自己的刻度）+ 昨收
  g.strokeStyle='#232833';[lo,hi].forEach(v=>{g.beginPath();g.moveTo(x0,Ya(v));g.lineTo(x1,Ya(v));g.stroke();});
  g.fillStyle='#8b93a3';g.fillText(fp(hi),x1+F(4),Ya(hi)+F(4));g.fillText(fp(lo),x1+F(4),Ya(lo)+F(4));
  if(y){g.setLineDash([F(4),F(4)]);g.strokeStyle='#8b93a3';g.beginPath();g.moveTo(x0,Ya(y));g.lineTo(x1,Ya(y));g.stroke();g.setLineDash([]);g.fillText('昨收 '+fp(y),x1+F(4),Ya(y)+F(4));}
  for(let i=1;i<h.length;i++){const a=h[i-1],b=h[i];if(a.price==null||b.price==null)continue;g.strokeStyle=(y&&b.price<y)?'#2ecc71':'#ff4d4f';g.lineWidth=F(1.8);g.beginPath();g.moveTo(X(mins(a.time)),Ya(a.price));g.lineTo(X(mins(b.time)),Ya(b.price));g.stroke();}
  const last=h[h.length-1];if(last.price!=null){const col=(y&&last.price<y)?'#2ecc71':'#ff4d4f';g.fillStyle=col;g.beginPath();g.arc(X(mins(last.time)),Ya(last.price),F(3),0,7);g.fill();
    const txt=fp(last.price)+(y?' '+chgTxt(last.price,y,dec(last.price)):'');g.fillText(txt,X(mins(last.time))+F(6)>x1-F(120)?x1-F(150):X(mins(last.time))+F(6),Ya(last.price)-F(6));}
  g.fillStyle='#e6e9ef';g.fillText('價',x0+F(4),y0a+F(11));
  // 下面板：多 / 空 勝率 0–100%
  g.strokeStyle='#232833';[0,50,100].forEach(v=>{g.beginPath();g.moveTo(x0,Yb(v));g.lineTo(x1,Yb(v));g.stroke();g.fillStyle='#8b93a3';g.fillText(v+'%',x1+F(4),Yb(v)+F(4));});
  const line=(key,col)=>{g.strokeStyle=col;g.lineWidth=F(1.6);g.beginPath();let st=false;h.forEach(p=>{if(p[key]==null)return;const xx=X(mins(p.time)),yy=Yb(p[key]);st?g.lineTo(xx,yy):g.moveTo(xx,yy);st=true;});g.stroke();
    if(st){g.fillStyle=col;g.beginPath();g.arc(X(mins(last.time)),Yb(last[key]),F(2.5),0,7);g.fill();}};
  line('p_long','#ff4d4f');line('p_short','#2ecc71');
  g.fillStyle='#ff4d4f';g.fillText(`— 多 ${f(last.p_long,0)}%`,x0+F(4),y0b+F(11));g.fillStyle='#2ecc71';g.fillText(`— 空 ${f(last.p_short,0)}%`,x0+F(70),y0b+F(11));
  g.fillStyle='#8b93a3';g.fillText(`每 ${Math.round((STATE?.interval||180)/60)} 分鐘一次估算，共 ${h.length} 次`,x0+F(140),y0b+F(11));}
</script>
