<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>族群戰法損益排行</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        details > summary { cursor: pointer; list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] .chev { transform: rotate(90deg); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-[1400px] mx-auto space-y-6">

        <!-- Header & Nav Tabs -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">🏆 族群戰法損益排行</h1>
                    <p class="text-slate-500 text-sm mt-1">族群漲跌排行的全部成分股，逐檔回測近 3 年各戰法的實際損益，找出賺最多與賠最多的戰法</p>
                </div>
                <div id="meta" class="text-xs text-slate-500 md:text-right space-y-1"></div>
            </div>

            <div class="flex flex-wrap gap-2 mt-6 border-b border-slate-100 pb-2">
                <a href="./index.html" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">📊 台指期夜盤預測</a>
                <a href="./broker.html" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">🏦 主力券商買超分析</a>
                <a href="./stock.html" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">🎯 個股策略分析</a>
                <a href="./themes.html" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">🧩 族群漲跌排行</a>
                <a href="./us-tech.html" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">🇺🇸 美股科技連動</a>
                <a href="./theme-strategies.html" class="px-4 py-2 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-lg border border-indigo-100">🏆 族群戰法損益</a>
            </div>
        </div>

        <div id="status" class="hidden"></div>

        <!-- 賺最多 / 賠最多 -->
        <div id="ranking" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>

        <!-- 全部戰法損益 -->
        <div id="allChart" class="bg-white rounded-xl shadow-sm p-6 border border-slate-200"></div>

        <!-- 各族群 -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">📋 各族群最賺／最賠戰法</h2>
                    <p class="text-xs text-slate-400 mt-0.5">依族群漲跌排行的順序；點擊族群展開該族群全部戰法的近 3 年損益</p>
                </div>
                <input id="filter" type="search" placeholder="搜尋族群或戰法" class="px-3 py-2 rounded-lg border border-slate-300 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
            <div id="themes" class="space-y-2"></div>
        </div>

        <div id="method" class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 text-sm text-slate-600 space-y-2"></div>

        <footer class="text-center text-xs text-slate-400 py-4">
            族群名單：<a href="https://finlab.finance/stocks/themes" target="_blank" rel="noopener" class="hover:underline">FinLab 族群</a> ｜ 回測資料：FinMind ｜ 策略引擎同「個股策略分析」頁 | 自動化發布 via GitHub Actions & Pages
        </footer>
    </div>

    <script src="./assets/theme-strategies-app.js"></script>

</html>
